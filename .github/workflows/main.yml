name: CI

# Controls when the workflow will run
on:
  # Builds every push to "main" (deploy + profile publish follow a green build)
  push:
    branches: ["main"]

  # Builds pull requests so breakage is caught before merge;
  # deploy/publish jobs below are skipped for PR events
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default GITHUB_TOKEN permissions for every job; jobs that need more
# (deploy) declare their own permissions block.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Resume PDF
        run: npm run build.resume

      - name: Generate Static Site
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: page
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: page
          path: .
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-profile-readme:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    env:
      PROFILE_REPO_PAT: ${{ secrets.READMETOKEN }}
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v7
        with:
          path: site

      - name: Skip profile publish when secret is missing
        if: ${{ env.PROFILE_REPO_PAT == '' }}
        run: echo "PROFILE_REPO_PAT is not set. Skipping profile README publish."

      - name: Checkout profile repository
        if: ${{ env.PROFILE_REPO_PAT != '' }}
        uses: actions/checkout@v7
        with:
          repository: SergeiGolos/SergeiGolos
          token: ${{ env.PROFILE_REPO_PAT }}
          path: profile

      - name: Sync profile README
        if: ${{ env.PROFILE_REPO_PAT != '' }}
        run: |
          cp site/template/README.md profile/README.md
          cd profile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No README changes to publish."
            exit 0
          fi
          git add README.md
          git commit -m "chore: sync profile README from portfolio"
          git push
